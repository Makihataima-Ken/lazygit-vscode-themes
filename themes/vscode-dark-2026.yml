# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
# VS Code "Dark 2026" theme for lazygit.
# Source: microsoft/vscode extensions/theme-defaults/themes/2026-dark.json
#
# VS Code uses translucent borders and selection backgrounds here. LazyGit
# accepts only opaque #RGB / #RRGGBB colors, so their base/visible hues are used.

gui:
  border: single
  theme:
    activeBorderColor:
      - '#3994BC'
      - bold
    inactiveBorderColor:
      - '#8C8C8C'
    searchingActiveBorderColor:
      - '#E0B97F'
      - bold
    optionsTextColor:
      - '#48A0C7'
    selectedLineBgColor:
      - '#323334'
    inactiveViewSelectedLineBgColor:
      - '#2C2D2E'
    cherryPickedCommitFgColor:
      - '#FFFFFF'
    cherryPickedCommitBgColor:
      - '#297AA0'
    markedBaseCommitFgColor:
      - '#121314'
    markedBaseCommitBgColor:
      - '#E0B97F'
    unstagedChangesColor:
      - '#E5BA7D'
    defaultFgColor:
      - '#BBBEBF'
